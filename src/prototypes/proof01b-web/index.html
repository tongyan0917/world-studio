<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">

    <meta
      name="description"
      content="World Studio Proof 01B：让同时间因果推进、世界历史与权威边界可见的网页原型。"
    >
    <title>World Studio · Proof 01B</title>
    <link rel="stylesheet" href="/prototype/proof01b/styles.css">
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <a class="brand" href="/prototype/proof01b?variant=A" aria-label="World Studio Proof 01B 首页">
          <span class="brand-mark" aria-hidden="true">W</span>
          <span>
            <strong>World Studio</strong>
            <small>ENGINE PROOF 01B</small>
          </span>
